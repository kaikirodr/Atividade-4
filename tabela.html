<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
    table, td, th{
    border: 1px dashed rgb(21, 8, 138);
    border-collapse: collapse;
    text-align: center;
    padding: 2%;
}

.cabecalho{
    background-color: rgb(30, 185, 69);
    font-weight: bold;
}
    </style>
</head>
<body>
    
<table>
    <caption>Trajetoria Acadêmica e Profissional</caption>
    <tr class="cabecalho">
        <th rowspan="2" width="20%">Estudante</th>
        <th colspan="2">Formação</th>
        <th rowspan="2">Ano de Conclusão</th>
    </tr>
    <tr class="cabecalho">        
        <th>Graduação</th>
        <th>Pós-Graduação</th>        
    </tr>
    <tr>
        <th>José</th>
        <td>Ciência da computação</td>
        <td>Inteligência Artificial</td>
        <td>2023</td>
    </tr>
    <tr>
        <th>Ana</th>
        <td>Engenharia de Software</td>
        <td>Gestão de projetos</td>
        <td>2022</td>
    </tr>
</table>

</body>
</html>
